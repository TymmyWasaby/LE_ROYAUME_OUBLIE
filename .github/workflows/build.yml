name: Build NumWorks app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (nwlink incompatible Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup ARM toolchain + ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi imagemagick

      - name: Generate valid 55x56 icon
        run: |
          convert -size 55x56 xc:'#1B5E20' -fill '#FFC928' -draw "circle 27,27 27,8" \
            -fill '#E53935' -draw "circle 27,28 27,14" \
            -fill white -draw "circle 21,24 21,4" -fill white -draw "circle 33,24 33,4" \
            -fill black -draw "circle 21,25 21,2" -fill black -draw "circle 33,25 33,2" \
            -fill '#FFC928' -draw "rectangle 24,34 30,40" src/icon.png && identify src/icon.png

      - name: Build app
        run: make clean build

      - name: Diagnostics
        run: |
          { echo "=== Diagnostics du build ==="
            echo "Taille du tymbrawl.nwa : $(du -k target/tymbrawl.nwa | cut -f1) Ko"
            echo "=== Sections (.data + .bss = RAM utilisee, limite ~148 Ko) ==="
            arm-none-eabi-size -A target/tymbrawl.nwa
          } | tee relnotes.txt

      - name: Upload NWA
        uses: actions/upload-artifact@v4
        with:
          name: tymbrawl-numworks-nwa
          path: target/tymbrawl.nwa

      - name: Publier le NWA en Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest target/tymbrawl.nwa --title "Dernier build" --notes-file relnotes.txt --clobber || gh release upload latest target/tymbrawl.nwa --clobber
